# Mises à jour des dépendances de test et des actions GitHub.
# Dependabot ne lit ce fichier que sur la branche par défaut (main) : il
# n'agit qu'une fois cette configuration fusionnée.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
